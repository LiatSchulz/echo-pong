name: Kubernetes integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kind:
    name: Kind rollout and network isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect runner tools
        # Docker, Kind, kubectl, and Helm ship in the Ubuntu 24.04 runner image.
        run: |
          docker version
          kind version
          kubectl version --client
          helm version --short
          python3 --version

      - name: Render all Kustomize entrypoints
        run: |
          kubectl kustomize k8s > /dev/null
          kubectl kustomize k8s/overlays/local > /dev/null
          kubectl kustomize k8s/overlays/ingress > /dev/null

      - name: Build and smoke-test native image
        run: |
          docker build --platform linux/amd64 -t echo-pong:local .
          python3 scripts/check-container.py echo-pong:local

      - name: Create Kind with Calico and Traefik
        run: scripts/local-cluster.sh

      - name: Load image and provision development token
        run: |
          kind load docker-image echo-pong:local --name echo-pong
          kubectl --context kind-echo-pong apply -f k8s/base/namespace.yaml
          umask 077
          mkdir -p secrets
          openssl rand -hex 32 > secrets/token
          kubectl --context kind-echo-pong -n echo-pong create secret generic echo-pong-auth \
            --from-file=token=secrets/token

      - name: Validate and deploy manifests
        run: |
          kubectl --context kind-echo-pong apply --dry-run=server -k k8s/overlays/local
          kubectl --context kind-echo-pong apply -k k8s/overlays/local
          kubectl --context kind-echo-pong -n echo-pong rollout status deployment/echo-pong --timeout=180s
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            --max-time 5 -H 'Host: echo-pong.localhost' http://127.0.0.1:8080/health

      - name: Verify availability through ingress during rollout
        run: python3 scripts/check-rollout.py --url http://127.0.0.1:8080

      - name: Verify enforced ingress and egress policy
        run: scripts/verify-network.sh

      - name: Show cluster diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-echo-pong get nodes -o wide || true
          kubectl --context kind-echo-pong get pods -A -o wide || true
          kubectl --context kind-echo-pong get events -A --sort-by=.lastTimestamp || true
          kubectl --context kind-echo-pong -n echo-pong logs deployment/echo-pong --all-pods --tail=100 || true
          kubectl --context kind-echo-pong -n traefik logs deployment/traefik --tail=100 || true

      - name: Remove development cluster and token
        if: always()
        run: |
          kind delete cluster --name echo-pong
          rm -f secrets/token
