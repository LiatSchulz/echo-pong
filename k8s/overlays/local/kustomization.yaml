apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: echo-pong
resources:
  - ../../base
  - ../../components/ingress
images:
  - name: ghcr.io/liatschulz/echo-pong
    newName: echo-pong
    newTag: local
patches:
  - target:
      kind: Deployment
      name: echo-pong
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
