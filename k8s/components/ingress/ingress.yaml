apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-pong
spec:
  ingressClassName: traefik
  rules:
    - host: echo-pong.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-pong
                port:
                  name: http
